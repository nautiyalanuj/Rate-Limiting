name: rate-limiting-local
services:
  prometheus:
    image: prom/prometheus:v3.7.1
    profiles: [metrics]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [metrics, tracing]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-demo-only}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  otel-collector:
    image: otel/opentelemetry-collector:0.137.0
    profiles: [tracing]
    network_mode: host
    command: [--config=/etc/otelcol/config.yaml]
    depends_on: [tempo]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro
  tempo:
    image: grafana/tempo:2.10.1
    profiles: [tracing]
    network_mode: host
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./ops/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  postgres:
    image: postgres:17.6
    profiles: [storage]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/users.sql:/docker-entrypoint-initdb.d/001-users.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  postgres-data:
