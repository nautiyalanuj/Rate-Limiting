app.metrics.enabled=${METRICS_ENABLED:false}
app.tracing.enabled=${TRACING_ENABLED:false}
# Only the scrape endpoint can be opted in; no other actuator endpoints are exposed.
management.endpoints.access.default=none
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=${app.metrics.enabled}
management.metrics.enable.all=${app.metrics.enabled}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=${app.metrics.enabled}
# Prometheus handles metrics; prevent the OTel starter from also pushing OTLP metrics.
management.otlp.metrics.export.enabled=false
management.opentelemetry.enabled=${app.tracing.enabled}
management.tracing.export.enabled=${app.tracing.enabled}
management.tracing.export.otlp.enabled=${app.tracing.enabled}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.timeout=2s
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
# Environment-provided OTel settings must not bypass the explicit feature flag.
management.opentelemetry.map-environment-variables=false
