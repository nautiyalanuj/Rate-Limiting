spring.application.name=rate-limiting-demo
# Start without PostgreSQL; select postgres explicitly to use your database.
spring.profiles.default=demo
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.config.import=classpath:observability.properties

# Each named policy is shared by all matching routes and all callers in this JVM.
app.rate-limits.policies.users.algorithm=FIXED_WINDOW
app.rate-limits.policies.users.capacity=20
app.rate-limits.policies.users.period=10s
app.rate-limits.policies.weather.algorithm=TOKEN_BUCKET
app.rate-limits.policies.weather.capacity=5
app.rate-limits.policies.weather.period=10s
app.rate-limits.policies.fixed-demo.algorithm=FIXED_WINDOW
app.rate-limits.policies.fixed-demo.capacity=3
app.rate-limits.policies.fixed-demo.period=10s
app.rate-limits.policies.sliding-demo.algorithm=SLIDING_WINDOW
app.rate-limits.policies.sliding-demo.capacity=3
app.rate-limits.policies.sliding-demo.period=10s
app.rate-limits.policies.token-demo.algorithm=TOKEN_BUCKET
app.rate-limits.policies.token-demo.capacity=3
app.rate-limits.policies.token-demo.period=10s
app.rate-limits.policies.circuit-demo.algorithm=FIXED_WINDOW
app.rate-limits.policies.circuit-demo.capacity=100
app.rate-limits.policies.circuit-demo.period=10s

# Open after >=50% failures in the last 4 calls, once 4 calls have completed.
app.circuit-breaker.window-size=4
app.circuit-breaker.minimum-calls=4
app.circuit-breaker.failure-threshold=50
app.circuit-breaker.open-duration=5s

# Weatherly is a Python wrapper for WeatherAPI.com; Java uses its HTTP API.
app.weather.base-url=${WEATHER_API_BASE_URL:https://api.weatherapi.com/v1}
app.weather.api-key=${WEATHER_API_KEY:}
app.weather.connect-timeout=2s
app.weather.read-timeout=3s

# MCP tools use the same quotas and circuits as the REST controllers.
spring.ai.mcp.server.name=rate-limiting-demo
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
# Keep this teaching server local; remote access needs an authentication boundary.
server.address=127.0.0.1
